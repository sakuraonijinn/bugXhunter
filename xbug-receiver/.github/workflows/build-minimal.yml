name: Build Minimal Receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Setup Android SDK
      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip 2>/dev/null || true
          unzip -q commandlinetools-linux-9477386_latest.zip 2>/dev/null || true
          mv cmdline-tools latest 2>/dev/null || true
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          echo "$ANDROID_HOME" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      # 3. Setup Android NDK for native library compilation
      - name: Setup Android NDK
        run: |
          SDKMANDIR=$ANDROID_HOME
          export ANDROID_NDK=$SDKMANDIR/ndk/25.1.8937393
          echo "ANDROID_NDK=$ANDROID_NDK"

      # 4. Generate Keystore automatically
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-release-key.keystore \
          -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug, O=Android, C=US"

      # 5. Build Native Library (libaudio_receiver.so)
      - name: Build Native Library
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/25.1.8937393
          cd xbug-receiver/app
          mkdir -p jniLibs/arm64-v8a
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
            -shared -O2 -o jniLibs/arm64-v8a/libaudio_receiver.so \
            c/receiver/audio_receiver.c \
            -lm -lcrypto -lssl -llog
          echo "Native library built and placed in jniLibs"

      # 5. Build APK
      - name: Build APK
        run: cd xbug-receiver/app && ./gradlew assembleDebug 2>&1 | tail -20

      # 6. Sign APK
      - name: Sign APK
        run: |
          UNSIGNED=$(find . -name "*.apk" ! -name "*-signed.apk" | head -1)
          echo "Unsigned APK: $UNSIGNED"
          apksigner sign \
            --ks my-release-key.keystore \
            --ks-pass pass:android \
            --ks-key-alias my-alias \
            --out signed.apk \
            "$UNSIGNED"
            
      # 7. Upload the signed APK
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalReceiverAPK
          path: signed.apk
