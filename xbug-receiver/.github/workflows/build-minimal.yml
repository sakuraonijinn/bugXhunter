name: Build Minimal Receiver APK

on:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Clone the bugXhunter repo (contains the C audio receiver)
      - name: Clone bugXhunter Repo
        run: |
          git clone https://github.com/sakuraonijinn/bugXhunter.git bugxhunter-src
          echo "C source available at: $(pwd)/bugxhunter-src/c/receiver/audio_receiver.c"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Use pre-installed Android SDK
      - name: Setup Android SDK Path
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n 1)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      # Install NDK
      - name: Install NDK
        run: |
          sdkmanager "ndk;25.1.8937393" 2>/dev/null || true
          if [ -d "$ANDROID_HOME/ndk/25.1.8937393" ]; then
            echo "NDK installed"
          else
            echo "NDK not found, using system default"
          fi

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-release-key.keystore \
          -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug, O=Android, C=US"

      # Build Native Library (libaudio_receiver.so)
      - name: Build Native Library
        run: |
          NDK=$ANDROID_HOME/ndk/25.1.8937393
          if [ ! -d "$NDK" ]; then
            NDK=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using NDK: $NDK"
          mkdir -p xbug-receiver/app/jniLibs/arm64-v8a
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
            -shared -O2 -o xbug-receiver/app/jniLibs/arm64-v8a/libaudio_receiver.so \
            bugxhunter-src/c/receiver/audio_receiver.c \
            -lm -llog
          echo "Native library built: $(ls -lh xbug-receiver/app/jniLibs/arm64-v8a/libaudio_receiver.so)"
          mkdir -p xbug-receiver/app/src/main/jniLibs/arm64-v8a/
          cp xbug-receiver/app/jniLibs/arm64-v8a/libaudio_receiver.so xbug-receiver/app/src/main/jniLibs/arm64-v8a/

      # Build APK
      - name: Build APK
        run: |
          cd xbug-receiver/app
          if [ ! -f "gradlew" ]; then
            echo "No gradlew found, creating one..."
            gradle wrapper 2>/dev/null || true
          fi
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -30 || gradle assembleDebug --stacktrace 2>&1 | tail -30

      # Sign APK
      - name: Sign APK
        run: |
          UNSIGNED=$(find . -name "*.apk" ! -name "*-signed.apk" | head -1)
          echo "Unsigned APK: $UNSIGNED"
          apksigner sign \
            --ks my-release-key.keystore \
            --ks-pass pass:android \
            --ks-key-alias my-alias \
            --out signed.apk \
            "$UNSIGNED"

      # Upload the signed APK
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalReceiverAPK
          path: signed.apk
